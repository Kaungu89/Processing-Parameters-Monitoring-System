<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle decoration -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(20, 184, 166, 0.15)" stroke-width="1.5" />
  
  <!-- Outer Hexagon representing chemical structure of sulfuric acid reagents -->
  <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" filter="url(#glow)" />
  
  <!-- Nested Mineral Crystal structure representing ore extraction -->
  <path d="M 50,25 L 72,42.5 L 63,70 L 37,70 L 28,42.5 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-dasharray="1 1" />
  
  <!-- Inner core representing the active solution/leachate drops -->
  <path d="M 50,38 C 45,46 43,51 43,56 C 43,61 47,64 50,64 C 53,64 57,61 57,56 C 57,51 55,46 50,38 Z" fill="url(#tealGrad)" />
  
  <!-- Glowing central node -->
  <circle cx="50" cy="56" r="2.5" fill="#ffffff" />
</svg>
